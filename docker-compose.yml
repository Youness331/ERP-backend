name: erp

x-php: &php
  build:
    context: ./docker/php
    args:
      PHP_VERSION: "8.4"
  image: erp/php:8.4
  restart: unless-stopped
  working_dir: /var/www/html
  environment:
    PHP_IDE_CONFIG: "serverName=erp"
    # Container overrides: the host .env targets SQLite for local work, the
    # containers must talk to the MySQL/Redis services of this stack.
    APP_ENV: ${APP_ENV:-local}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-erp}
    DB_USERNAME: ${DB_USERNAME:-erp}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_CLIENT: phpredis
  volumes:
    - ./backend:/var/www/html
  networks: [erp]

services:
  app:
    <<: *php
    container_name: erp_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    <<: *php
    container_name: erp_queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [erp]

  db:
    image: mysql:8.4
    container_name: erp_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+01:00
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erp}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [erp]

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks: [erp]

volumes:
  dbdata:
  redisdata:

networks:
  erp:
    driver: bridge
